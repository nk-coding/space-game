[workspace]
resolver = "3"
# Every crate under crates/ is a member. Experiments and benchmarks live in separate local repos
# (ADR-0025), e.g. ../space-game-physics-bench.
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# Bevy recommendation: optimise dependencies even in dev builds, keep our code quick to compile.
[profile.dev]
opt-level = 1
# Line tables are enough for backtraces; full debug info made dev builds (and the dev wasm) huge.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Everyday web builds (`scripts/web-build.sh`, ADR-0034): optimised code without LTO, split for the cores and
# incremental, so a change in `game` rebuilds in about 30 s instead of five minutes. `--full` uses `release`.
[profile.web-dev]
inherits = "release"
codegen-units = 16
lto = false
incremental = true

