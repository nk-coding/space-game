[workspace]
resolver = "3"
# Every crate under crates/<group>/ is a member (ADR-0038): core/ (data, sim, arena: engine-free), client/ (art, kit,
# world, game, and lab-worker: the evolution lab's web worker, ADR-0043), tools/ (arena-cli, content-tool; ADR-0040). Experiments and benchmarks live in separate local repos (ADR-0025), e.g.
# ../space-game-physics-bench.
members = ["crates/*/*"]

# The Bevy client's dependencies (ADR-0038: kit, world and game use them with `workspace = true`, so all three build
# Bevy, egui and the web APIs with one feature set).
[workspace.dependencies]
# Live tuning panel (dev tool). 0.43.x targets Bevy 0.20.
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
# Only what a 2D game needs. No audio and no gamepads for now (the VM lacks alsa/udev headers).
# An explicit list instead of the `default_app`/`2d_api`/`ui_api` umbrellas: those pull `common_api`, which adds
# bevy_animation, bevy_gizmos and the .hdr format; the game uses none of them. Re-check on every Bevy upgrade.
bevy = { version = "=0.20.0", default-features = false, features = [
  "std",
  "async_executor", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",  # = default_app
  "bevy_camera", "bevy_color", "bevy_curve", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material",
  "bevy_text", "bevy_window",                                                          # common_api minus animation, gizmos, hdr, png (no raster files)
  "bevy_sprite",                                                                       # 2d_api
  "bevy_input_focus", "bevy_ui",                                                       # ui_api
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",    # bloom (toggle)
  "bevy_sprite_render",   # sprites, Mesh2d, ColorMaterial
  "bevy_ui_render",       # UI
  "default_font",
  "bevy_winit",
  "webgl2",
  "keyboard",
  "mouse",
  "touch",
  "x11",                  # native desktop builds (winit loads libX11 at runtime, no headers needed)
  "android-native-activity",  # the pure-Rust Android backend (GameActivity would compile C++)
] }
web-sys = { version = "=0.3.106", features = [
  "Window", "Location", "console",
  # world/storage.rs: IndexedDB and the storage estimate
  "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode",
  "IdbObjectStore", "DomStringList", "StorageManager", "StorageEstimate", "DomException",
  # kit/clipboard.rs, game/drydock/share.rs: copy / paste events, downloads, the file chooser
  "Document", "HtmlDocument", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "CssStyleDeclaration",
  "Navigator", "Clipboard", "Event", "EventTarget", "AddEventListenerOptions", "KeyboardEvent", "ClipboardEvent",
  "DataTransfer", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader",
  # world/evolution/workers.rs and lab-worker: the evolution lab's web workers (ADR-0043)
  "Worker", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope",
] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
# Awaiting IndexedDB before the app starts (world/storage.rs, game's main); already in the build through Bevy.
wasm-bindgen-futures = "=0.4.79"
# The system clipboard on desktop (already in the build through bevy_egui, which also turns on arboard's default
# features, so `default-features = false` here changes nothing).
arboard = { version = "=3.6.1", default-features = false }

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# Bevy recommendation: optimise dependencies even in dev builds, keep our code quick to compile.
[profile.dev]
opt-level = 1
# Line tables are enough for backtraces; full debug info made dev builds (and the dev wasm) huge.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Everyday web builds (`scripts/web-build.sh`, ADR-0034): optimised code without LTO, split for the cores and
# incremental, so a change in `game` rebuilds in about 30 s instead of five minutes. `--full` uses `release`.
[profile.web-dev]
inherits = "release"
codegen-units = 16
lto = false
incremental = true

