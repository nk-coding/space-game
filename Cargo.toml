[workspace]
resolver = "3"
# Every crate under crates/ is a member. Experiments and benchmarks live in separate local repos
# (ADR-0025), e.g. ../space-game-physics-bench.
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# Bevy recommendation: optimise dependencies even in dev builds, keep our code quick to compile.
[profile.dev]
opt-level = 1
# Line tables are enough for backtraces; full debug info made dev builds (and the dev wasm) huge.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Web release: smaller wasm. Used by `trunk build --release` via Trunk.toml / cargo profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
