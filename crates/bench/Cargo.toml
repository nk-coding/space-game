# Physics engine benchmark. Its own cargo workspace (excluded from the game workspace),
# so the engines under test never leak into the game's lockfile.
[workspace]
resolver = "3"
members = ["core", "rapier", "box2d", "avian", "boxdd", "native", "wasm"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bench-core = { path = "core" }
bench-rapier = { path = "rapier" }
bench-box2d = { path = "box2d" }
bench-avian = { path = "avian" }
bench-boxdd = { path = "boxdd" }
# Engines under test, exact versions.
rapier2d = { version = "=0.36.1", default-features = false }
box2d-rust = { version = "=1.4.0", default-features = false }
avian2d = { version = "=0.7.0", default-features = false }
bevy = { version = "=0.19.1", default-features = false }
boxdd-sys = { version = "=0.6.0" }

[profile.release]
codegen-units = 1
lto = "thin"
debug = false

# Smaller wasm for the web page / Node runs (same code, size-optimised).
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = "debuginfo"
