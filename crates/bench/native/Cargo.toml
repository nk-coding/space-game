[package]
name = "bench-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# One engine per binary (like the wasm builds), so cargo feature unification between engines can't change
# an engine's code (e.g. libm/num-traits features) and native vs wasm compare the same feature set.
# `run-all.sh` builds bin/bench-{st,mt}-<engine>. The default (all engines) is for quick local runs only.
[features]
default = ["rapier", "box2d", "avian", "boxdd"]
rapier = ["dep:bench-rapier"]
box2d = ["dep:bench-box2d"]
avian = ["dep:bench-avian"]
boxdd = ["dep:bench-boxdd"]
parallel = ["bench-rapier?/parallel", "bench-avian?/parallel"]

[dependencies]
bench-core.workspace = true
bench-rapier = { workspace = true, optional = true }
bench-box2d = { workspace = true, optional = true }
bench-avian = { workspace = true, optional = true }
bench-boxdd = { workspace = true, optional = true }
