[package]
name = "bench-rapier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
parallel = ["rapier2d/parallel"]

[dependencies]
bench-core.workspace = true
rapier2d = { workspace = true, features = ["dim2", "f32", "std", "enhanced-determinism"] }
parry2d = { version = "=0.31.1", default-features = false }
