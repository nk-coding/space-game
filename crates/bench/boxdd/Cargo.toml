[package]
name = "bench-boxdd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Box2D C (v3.2-dev snapshot, same commit box2d-rust ports) via boxdd-sys raw FFI. Reference number only, native only. Never used in the game."

[dependencies]
bench-core.workspace = true
# Raw FFI layer of `boxdd`: compiles the vendored Box2D C sources with `cc` (gcc), pre-generated bindings.
boxdd-sys = { version = "=0.6.0" }
