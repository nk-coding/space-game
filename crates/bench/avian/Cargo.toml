[package]
name = "bench-avian"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
parallel = ["avian2d/parallel", "bevy/multi_threaded"]

[dependencies]
bench-core.workspace = true
avian2d = { workspace = true, features = ["2d", "f32", "parry-f32", "enhanced-determinism"] }
bevy = { workspace = true, features = ["std"] }

# Bevy needs its `web` feature on wasm32 (performance.now() instead of std::time::Instant, which panics there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["std", "web"] }
