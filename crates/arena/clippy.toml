# Determinism rule (see src/math.rs): std's transcendental float functions may differ per platform, and
# fused multiply-add changes rounding. Use `sim::math` (libm, pure Rust) instead.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm; use sim::math::sin" },
    { path = "f32::cos", reason = "platform libm; use sim::math::cos" },
    { path = "f32::tan", reason = "platform libm; use sim::math" },
    { path = "f32::sin_cos", reason = "platform libm; use sim::math::Rot::from_angle" },
    { path = "f32::asin", reason = "platform libm; use sim::math" },
    { path = "f32::acos", reason = "platform libm; use sim::math" },
    { path = "f32::atan", reason = "platform libm; use sim::math" },
    { path = "f32::atan2", reason = "platform libm; use sim::math::atan2" },
    { path = "f32::exp", reason = "platform libm; use sim::math::exp" },
    { path = "f32::exp2", reason = "platform libm; use sim::math" },
    { path = "f32::ln", reason = "platform libm; use sim::math" },
    { path = "f32::log", reason = "platform libm; use sim::math" },
    { path = "f32::log2", reason = "platform libm; use sim::math" },
    { path = "f32::log10", reason = "platform libm; use sim::math" },
    { path = "f32::powf", reason = "platform libm; use sim::math" },
    { path = "f32::powi", reason = "unspecified rounding; multiply explicitly" },
    { path = "f32::hypot", reason = "platform libm; use Vec2::length" },
    { path = "f32::cbrt", reason = "platform libm; use sim::math" },
    { path = "f32::mul_add", reason = "FMA changes rounding; write a * b + c" },
    { path = "f64::sin", reason = "platform libm; use sim::math" },
    { path = "f64::cos", reason = "platform libm; use sim::math" },
    { path = "f64::tan", reason = "platform libm; use sim::math" },
    { path = "f64::sin_cos", reason = "platform libm; use sim::math" },
    { path = "f64::atan2", reason = "platform libm; use sim::math" },
    { path = "f64::exp", reason = "platform libm; use sim::math" },
    { path = "f64::ln", reason = "platform libm; use sim::math" },
    { path = "f64::powf", reason = "platform libm; use sim::math" },
    { path = "f64::powi", reason = "unspecified rounding; multiply explicitly" },
    { path = "f64::hypot", reason = "platform libm; use sim::math" },
    { path = "f64::mul_add", reason = "FMA changes rounding; write a * b + c" },
]
