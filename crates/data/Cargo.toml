[package]
name = "data"
version = "0.1.0"
description = "Game content: schema, pack loader, validation, stat lines and shared blueprint geometry. No Bevy, builds for wasm32."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["embed"]
# Compile the base pack (content/base, without wiki/) into the binary: `data::base_content()`.
embed = []
# Load packs from a directory (native tools only; the core never touches the filesystem).
fs = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"

[dev-dependencies]
serde_json = "1.0.154"
