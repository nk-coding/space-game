# Determinism rule (as in crates/sim/clippy.toml): data's geometry feeds the sim: std's transcendental float functions may differ per platform, and
# fused multiply-add changes rounding. Use the `libm` crate (pure Rust) instead.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm; use libm" },
    { path = "f32::cos", reason = "platform libm; use libm" },
    { path = "f32::tan", reason = "platform libm; use libm" },
    { path = "f32::sin_cos", reason = "platform libm; use libm" },
    { path = "f32::asin", reason = "platform libm; use libm" },
    { path = "f32::acos", reason = "platform libm; use libm" },
    { path = "f32::atan", reason = "platform libm; use libm" },
    { path = "f32::atan2", reason = "platform libm; use libm2" },
    { path = "f32::exp", reason = "platform libm; use libm" },
    { path = "f32::exp2", reason = "platform libm; use libm" },
    { path = "f32::ln", reason = "platform libm; use libm" },
    { path = "f32::log", reason = "platform libm; use libm" },
    { path = "f32::log2", reason = "platform libm; use libm" },
    { path = "f32::log10", reason = "platform libm; use libm" },
    { path = "f32::powf", reason = "platform libm; use libm" },
    { path = "f32::powi", reason = "unspecified rounding; multiply explicitly" },
    { path = "f32::hypot", reason = "platform libm; use Vec2::length" },
    { path = "f32::cbrt", reason = "platform libm; use libm" },
    { path = "f32::mul_add", reason = "FMA changes rounding; write a * b + c" },
    { path = "f64::sin", reason = "platform libm; use libm" },
    { path = "f64::cos", reason = "platform libm; use libm" },
    { path = "f64::tan", reason = "platform libm; use libm" },
    { path = "f64::sin_cos", reason = "platform libm; use libm" },
    { path = "f64::atan2", reason = "platform libm; use libm" },
    { path = "f64::exp", reason = "platform libm; use libm" },
    { path = "f64::ln", reason = "platform libm; use libm" },
    { path = "f64::powf", reason = "platform libm; use libm" },
    { path = "f64::powi", reason = "unspecified rounding; multiply explicitly" },
    { path = "f64::hypot", reason = "platform libm; use libm" },
    { path = "f64::mul_add", reason = "FMA changes rounding; write a * b + c" },
]
