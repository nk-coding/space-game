[package]
name = "sim"
version = "0.1.0"
description = "Engine-independent, deterministic simulation core: ships, power, heat, damage, breakage. No Bevy, no threads, no filesystem; builds for wasm32."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../data" }
# Pure-Rust transcendental functions (sin, cos, atan2, exp, ...): identical results on every platform.
# `default-features = false` drops the `arch` feature, so no platform-specific code path is ever used.
libm = { version = "=0.2.16", default-features = false }

[[example]]
name = "determinism"
