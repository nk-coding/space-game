[package]
name = "content-tool"
version = "0.1.0"
description = "Native CLI for content packs: validate, export resolved content as JSON, list entries, generate the static wiki."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../../core/data", default-features = false, features = ["fs"] }
# Behavior vocabulary ↔ sim implementation check and Rhai compile check (`sim::behavior::check_vocabulary`).
sim = { path = "../../core/sim" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
