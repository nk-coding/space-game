[package]
name = "arena-cli"
version = "0.1.0"
description = "The arena's native CLI (`arena fight`, `matrix`, `evolve`): batches of headless fights and evolution runs on every core, as Markdown tables. A thin binary over the `arena` library (ADR-0040)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
arena = { path = "../../core/arena" }
data = { path = "../../core/data" }
sim = { path = "../../core/sim" }
