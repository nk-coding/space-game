[package]
name = "galaxy"
version = "0.1.0"
description = "The galaxy generator (ADR-0042): a game's galaxy skeleton (clusters in bands, home, gates, trails of signals) and cluster interiors from a seed and the content. Deterministic, no Bevy, no I/O; builds for wasm32."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../data" }
serde = { version = "1.0.229", features = ["derive"] }
ron = "=0.12.2"  # the skeleton's text form, hashed and saved like the content
# Pure-Rust math (sin, cos, atan2, sqrt): identical results on every platform (ADR-0010).
libm = { version = "=0.2.16", default-features = false }
