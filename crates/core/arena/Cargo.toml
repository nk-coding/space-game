[package]
name = "arena"
version = "0.1.0"
description = "Headless, deterministic fights between designs on the sim: fight specs, results and the arena score, voyage fitness and the evolution of designs and behaviors. No Bevy, no I/O, no threads; builds for wasm32. Used by the game and by the `arena` CLI (`crates/tools/arena-cli`)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../data" }
sim = { path = "../sim" }
serde = { version = "1.0.229", features = ["derive"] }
ron = "=0.12.2"  # the fight spec's text form, the same RON as the content
# Fight codes (`code.rs`): base64url of the zlib-compressed RON, as the drydock's share codes.
base64 = "=0.22.1"
miniz_oxide = "=0.8.9"
