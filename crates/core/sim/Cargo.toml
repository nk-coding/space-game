[package]
name = "sim"
version = "0.1.0"
description = "Engine-independent, deterministic simulation core: ships, power, heat, damage, breakage. No Bevy, no threads, no filesystem; builds for wasm32."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../data" }
# Pure-Rust transcendental functions (sin, cos, atan2, exp, ...): identical results on every platform.
# `default-features = false` drops libm's `arch` feature here, but num-traits (through rapier) turns it back on;
# that is harmless: `arch` only switches exactly rounded operations (sqrt, fabs, ...) to hardware instructions.
libm = { version = "=0.2.16", default-features = false }
# Custom behavior conditions (Rhai nodes in content). Sandboxed raw engine: no packages, no `**` (float powf
# would go through the platform libm), no time, no modules/import, no eval; `sync` so the sim stays
# Send + Sync (Bevy resource); `f32_float` to match the sim. See `src/behavior/script.rs`.
rhai = { version = "=1.26.1", default-features = false, features = ["std", "sync", "f32_float", "no_time", "no_module", "no_custom_syntax"] }
# The physics engine (ADR-0014). `enhanced-determinism`: libm math in glam/simba, deterministic hash maps and
# iteration order (cannot be combined with `simd8`). Default features off: no `block-solver` (the benchmarked
# configuration). Single-threaded (no `parallel`) until numbers justify it on native.
rapier2d = { version = "=0.36.1", default-features = false, features = ["dim2", "f32", "std", "enhanced-determinism"] }

[[example]]
name = "determinism"
