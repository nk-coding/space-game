<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#010409" />
  <title>Space Game</title>
  <!-- Release builds run wasm-opt -O3; the cargo profile comes from the command line (scripts/web-build.sh,
       .github/workflows/pages.yml): `web-release` compiles the client for size already (ADR-0049), and -Oz on top
       saved 2 MiB raw, 0.1 MiB gzipped. -->
  <!-- data-initializer: the loading screen (loader.js: the download's progress, "starting" until the game's first
       frame, failures). -->
  <link data-trunk rel="rust" data-bin="game" data-initializer="loader.js" data-wasm-opt="3" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
  <!-- The evolution lab's web worker (ADR-0043): a second wasm binary, loaded by world::evolution's workers through
       the loader shim Trunk writes (lab-worker_loader.js). -->
  <link data-trunk rel="rust" href="../lab-worker/Cargo.toml" data-bin="lab-worker" data-type="worker" data-loader-shim data-wasm-opt="3" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
  <style>
    /* A page that never moves under a finger (a phone's browser): no pinch or double-tap zoom, no pull to refresh or
       overscroll, no text selection, long-press menu or tap flash. No viewport-fit=cover: the browser keeps the page
       clear of a notch and the home indicator, since the game lays its screens out to the window's edges. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #010409; touch-action: none;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                 -webkit-tap-highlight-color: transparent; }
    body {
      /* the same backdrop as in the game, shown while the wasm loads */
      background: radial-gradient(ellipse 75% 85% at 50% 45%, #0a1820, #050e15 55%, #010409);
      color: #869099; font: 12px/1.4 system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase;
    }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    /* The loading screen (loader.js sets data-phase: download, starting, failed, done). Over the canvas until the
       game's first frame. System fonts: Barlow is embedded in the wasm only. */
    #loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 22px; pointer-events: none; transition: opacity 0.5s ease;
               background: radial-gradient(ellipse 75% 85% at 50% 45%, #0a1820, #050e15 55%, #010409);
               font-family: Barlow, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    #loading[data-phase="done"] { opacity: 0; }
    #load-title { color: #ebf5ff; font-size: 26px; font-weight: 300; letter-spacing: 0.42em; margin-right: -0.42em;
                  text-shadow: 0 0 12px #8cefdb55; }
    #load-bar { position: relative; width: min(320px, 70vw); height: 2px; background: #86909933; overflow: hidden; }
    #load-fill { position: absolute; inset: 0; background: #8cefdb; box-shadow: 0 0 8px #8cefdb;
                 transform-origin: left; transform: scaleX(0); transition: transform 0.15s linear; }
    #loading.indeterminate #load-fill { transform: scaleX(0.3); transition: none; animation: sweep 1.4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-100%) scaleX(0.3); } to { transform: translateX(110%) scaleX(0.3); } }
    /* Starting (compiling, then the game's first frames): the full bar breathes, also while it fades out. */
    #loading[data-phase="starting"] #load-fill, #loading[data-phase="done"] #load-fill { transform: none; animation: breathe 1.1s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: 0.25; } to { opacity: 1; } }
    #load-status { display: flex; justify-content: space-between; width: min(320px, 70vw); font-size: 11px;
                   letter-spacing: 0.3em; margin-top: -12px; }
    #load-label { color: #869099; }
    #load-amount { color: #ebf5ff; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
    #load-error { display: none; flex-direction: column; align-items: center; gap: 14px; max-width: min(460px, 86vw);
                  text-align: center; text-transform: none; letter-spacing: 0.02em; font-size: 14px; color: #869099; }
    #load-error-title { color: #ec8f7c; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; }
    #load-error-detail { color: #5d6a74; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
    #load-error-detail:empty { display: none; }
    #load-error button { pointer-events: auto; cursor: pointer; margin-top: 6px; padding: 7px 22px; border-radius: 999px;
                         border: 1px solid #8cefdb; background: #8cefdb1a; color: #8cefdb; font: inherit; font-size: 11px;
                         letter-spacing: 0.3em; text-transform: uppercase; box-shadow: 0 0 10px #8cefdb44; }
    #loading[data-phase="failed"] #load-bar, #loading[data-phase="failed"] #load-status { display: none; }
    #loading[data-phase="failed"] #load-error { display: flex; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
              background: #010409ee; color: #8cefdb; z-index: 10; padding: 2em; }
    /* landscape only on phones */
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="loading" class="indeterminate" data-phase="page">
    <div id="load-title">Space Game</div>
    <div id="load-bar"><div id="load-fill"></div></div>
    <div id="load-status"><span id="load-label">Loading</span><span id="load-amount"></span></div>
    <div id="load-error">
      <div id="load-error-title"></div>
      <div id="load-error-text"></div>
      <div id="load-error-detail"></div>
      <button type="button" onclick="location.reload()">Reload</button>
    </div>
    <noscript>The game needs JavaScript and WebAssembly.</noscript>
  </div>
  <div id="rotate">rotate your device to landscape</div>
  <canvas id="game" tabindex="0" oncontextmenu="return false"></canvas>
  <script>
    // Give the canvas keyboard focus so the toggles work without a click first.
    addEventListener("load", () => document.getElementById("game").focus());
    // iOS Safari zooms the page on a pinch despite user-scalable=no; its gesture events are Safari's own.
    for (const name of ["gesturestart", "gesturechange"]) addEventListener(name, e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
