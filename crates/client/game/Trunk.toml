# Web build of the game client. From this directory:
#   trunk serve            (dev build, http://0.0.0.0:8081; 8080 is Niklas's served copy)
#   trunk build --release   (optimised; see scripts/web-build.sh)
[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["0.0.0.0"]
port = 8081
# Don't open a browser in the VM.
open = false

[watch]
# Everything that goes into the wasm, not only this crate.
watch = [".", "../kit", "../world", "../art", "../lab-worker", "../../core/sim", "../../core/data", "../../core/arena", "../../core/galaxy", "../../../content/base", "../../../art/tokens.json"]
ignore = ["dist", "../../../content/base/wiki"]

# The loading screen's total (index.html, loader.js): trunk 0.21.14 hands its initializer the wasm's size from before
# wasm-opt (70 MB for the 33 MB that is served), so the bar would stop half way. This writes the size of the file
# that ships into the page.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "for w in \"$TRUNK_STAGING_DIR\"/game-*_bg.wasm; do f=$(basename \"$w\"); n=$(wc -c < \"$w\"); sed -i \"s|$f', [0-9]*,|$f', $n,|\" \"$TRUNK_STAGING_DIR/index.html\"; done"]
