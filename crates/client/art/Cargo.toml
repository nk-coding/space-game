[package]
name = "art"
version = "0.1.0"
description = "Vector art at runtime: icons from the content pack, embedded style tokens, a resolution-independent atlas layout, and an in-memory rasteriser (resvg) for any pixel density. No Bevy; builds for wasm32."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Icons come from the content pack (`content/base/icons`, mods override by key).
data = { path = "../../core/data" }
# Pure-Rust SVG rendering; no text, no system fonts, no raster images (the art is pure vector).
resvg = { version = "=0.48.1", default-features = false }
serde_json = "1"
