[package]
name = "lab-worker"
version = "0.1.0"
description = "The evolution lab's web worker (GDR-0092 step 9, ADR-0043): a second wasm binary of the web build that fights the lab's jobs beside the frame. arena, data and sim with wasm-bindgen; no Bevy."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../../core/data" }
arena = { path = "../../core/arena" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
