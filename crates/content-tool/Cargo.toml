[package]
name = "content-tool"
version = "0.1.0"
description = "Native CLI for content packs: validate, export resolved content as JSON (for the wiki), list entries."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../data", default-features = false, features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
