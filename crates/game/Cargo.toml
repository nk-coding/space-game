[package]
name = "game"
version = "0.1.0"
description = "The Bevy client: web (wasm32 + WebGL2) first, desktop and Android later."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
data = { path = "../data" }
sim = { path = "../sim" }
# Vector art: embedded SVG icons + style tokens, rasterised at runtime (no committed raster graphics).
art = { path = "../art" }
# Live tuning panel (dev tool). 0.43.x targets Bevy 0.20.
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
# Only what a 2D game needs. No audio and no gamepads for now (the VM lacks alsa/udev headers).
bevy = { version = "=0.20.0", default-features = false, features = [
  "std",
  "default_app",          # asset, log, state, async executor, reflect auto-register
  "2d_api",               # camera, color, image, mesh, shader, material, text, window, png, sprite, gizmos
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",    # bloom (toggle)
  "bevy_sprite_render",   # sprites, Mesh2d, ColorMaterial
  "ui_api",               # debug overlay
  "ui_bevy_render",
  "default_font",
  "bevy_winit",
  "webgl2",
  "keyboard",
  "mouse",
  "touch",
  "x11",                  # native desktop builds (winit loads libX11 at runtime, no headers needed)
] }

# Share codes (drydock/share.rs): base64url of the zlib-compressed design; the payload is RON.
base64 = "=0.22.1"
miniz_oxide = "=0.8.9"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "Window", "Location", "console",
  # storage.rs: the browser's local storage
  "Storage", "DomException",
  # clipboard.rs, drydock/share.rs: copy / paste events, downloads, the file chooser
  "Document", "HtmlDocument", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "CssStyleDeclaration",
  "Navigator", "Clipboard", "Event", "EventTarget", "AddEventListenerOptions", "KeyboardEvent", "ClipboardEvent",
  "DataTransfer", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader",
] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"

# The system clipboard on desktop (already in the build through bevy_egui).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
